<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Spacers Bénévoles</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sora',sans-serif;background:linear-gradient(160deg,#042C53,#185FA5);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:white;border-radius:24px;padding:40px 32px;width:100%;max-width:400px;box-shadow:0 32px 80px rgba(0,0,0,0.4);}
.logo{text-align:center;margin-bottom:28px;}
.logo-icon{width:72px;height:72px;background:linear-gradient(135deg,#042C53,#185FA5);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 12px;}
.logo h1{font-size:20px;font-weight:800;color:#0C447C;}
.logo p{font-size:12px;color:#5F5E5A;margin-top:2px;}
label{font-size:12px;font-weight:600;color:#1a1a18;margin-bottom:6px;display:block;}
input{width:100%;padding:13px 16px;border:1.5px solid #D3D1C7;border-radius:12px;font-family:'Sora',sans-serif;font-size:14px;outline:none;margin-bottom:16px;}
input:focus{border-color:#185FA5;}
.btn{width:100%;padding:14px;background:#185FA5;color:white;border:none;border-radius:50px;font-family:'Sora',sans-serif;font-size:15px;font-weight:700;cursor:pointer;}
.btn:hover{background:#0C447C;}
.msg{border-radius:10px;padding:10px 14px;font-size:12px;margin-bottom:16px;display:none;}
.err{background:#FBEAF0;color:#993556;}
.ok{background:#EAF3DE;color:#3B6D11;}
.forgot{text-align:center;margin-top:14px;font-size:12px;}
.forgot a{color:#185FA5;font-weight:600;text-decoration:none;cursor:pointer;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🏐</div>
    <h1>Spacers Bénévoles</h1>
    <p>Saison 2026–2027</p>
  </div>
  <div class="msg" id="msg"></div>
  <label>Email</label>
  <input type="email" id="email" placeholder="votre@email.com">
  <label>Mot de passe</label>
  <input type="password" id="pwd" placeholder="••••••••">
  <button class="btn" id="btn" onclick="login()">Se connecter →</button>
  <div class="forgot"><a onclick="reset()">Mot de passe oublié ?</a></div>
</div>
<script>
const sb = window.supabase.createClient(
  'https://xphuolvbamdkizydveij.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwaHVvbHZiYW1ka2l6eWR2ZWlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNDQ2MDksImV4cCI6MjA5MjYyMDYwOX0.vpxV6ApwAkhlTx-LMCBZwee7LCdQGYP_5sbPMXEFFUQ'
)
async function login(){
  const email=document.getElementById('email').value.trim()
  const pwd=document.getElementById('pwd').value
  if(!email||!pwd){show('Remplissez tous les champs.','err');return}
  document.getElementById('btn').textContent='Connexion...'
  document.getElementById('btn').disabled=true
  const{error}=await sb.auth.signInWithPassword({email,password:pwd})
  if(error){show(getErr(error.message),'err');document.getElementById('btn').textContent='Se connecter →';document.getElementById('btn').disabled=false;return}
  window.location.href='dashboard.html'
}
async function reset(){
  const email=document.getElementById('email').value.trim()
  if(!email){show('Entrez votre email puis cliquez ici.','err');return}
  await sb.auth.resetPasswordForEmail(email)
  show('Email envoyé ! Vérifiez votre boîte.','ok')
}
function show(m,c){const e=document.getElementById('msg');e.textContent=m;e.className='msg '+c;e.style.display='block'}
function getErr(m){
  if(m.includes('Invalid login'))return'Email ou mot de passe incorrect.'
  if(m.includes('not confirmed'))return'Email non confirmé. Vérifiez votre boîte.'
  return'Erreur : '+m
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')login()})
sb.auth.getSession().then(({data})=>{if(data.session)window.location.href='dashboard.html'})
</script>
</body>
</html>
